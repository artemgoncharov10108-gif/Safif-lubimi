<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Сафийчик ❤️ Ты — моя вселенная</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

<div class="floating-hearts" id="heartsContainer"></div>

<div class="container">
    <div class="hero">
        <h1>❤️ Сафийчик, ты — моя вселенная ❤️</h1>
        <p>Каждый день я влюбляюсь в тебя заново</p>
        <div class="sub">✨ моя девочка, это для тебя ✨</div>
    </div>

    <div class="reasons-grid" id="reasonsGrid"></div>

    <button class="surprise-btn" id="surpriseBtn">💝 нажми для сюрприза 💝</button>

    <div class="gallery">
        <div class="gallery-item">📸</div>
        <div class="gallery-item">💕</div>
        <div class="gallery-item">🌹</div>
        <div class="gallery-item">✨</div>
        <div class="gallery-item">💖</div>
    </div>

    <div class="quote">
        «Сафийчик, с тобой каждый день — как маленькое чудо. Спасибо, что ты есть. Я люблю тебя ❤️»
    </div>

    <footer>
        <p>сделано с душой для моей Сафийчик 💕</p>
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
